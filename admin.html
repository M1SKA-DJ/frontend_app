<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛠 Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 16px 20px 100px;
            min-height: 100vh;
        }

        body.dark {
            background: #0d1117;
            color: #e6edf3;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        body.dark .header {
            border-bottom-color: #30363d;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .close-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: #ef4444;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .header .close-btn:hover {
            opacity: 0.8;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: white;
            padding: 6px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body.dark .tabs {
            background: #161b22;
        }

        .tab-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        body.dark .tab-btn {
            color: #8b949e;
        }

        .tab-btn.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .tab-btn:hover:not(.active) {
            background: #e8e8e8;
        }

        body.dark .tab-btn:hover:not(.active) {
            background: #30363d;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Form */
        .form-card {
            background: white;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body.dark .form-card {
            background: #161b22;
        }

        .form-card input,
        .form-card select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 8px;
            background: #f7fafc;
            color: #1a1a2e;
            transition: all 0.2s;
        }

        body.dark .form-card input,
        body.dark .form-card select {
            background: #0d1117;
            border-color: #30363d;
            color: #e6edf3;
        }

        .form-card input:focus,
        .form-card select:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .form-card .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-card .btn-add {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .form-card .btn-add:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .form-card .btn-danger {
            background: #ef4444;
        }

        .form-card .btn-danger:hover {
            background: #dc2626;
        }

        .form-card .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        body.dark .form-card .hint {
            color: #8b949e;
        }

        .form-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        body.dark .form-card label {
            color: #8b949e;
        }

        .form-card .section-divider {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }

        body.dark .form-card .section-divider {
            border-top-color: #30363d;
        }

        /* List */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        body.dark .list-item {
            background: #161b22;
        }

        .list-item:hover {
            transform: translateX(4px);
        }

        .list-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .list-item .info .title {
            font-weight: 600;
            font-size: 15px;
        }

        .list-item .info .sub {
            font-size: 13px;
            color: #718096;
        }

        body.dark .list-item .info .sub {
            color: #8b949e;
        }

        .list-item .delete-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .list-item .delete-btn:hover {
            opacity: 0.8;
            transform: scale(0.95);
        }

        .badge-specific {
            background: #8b5cf6;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-replacement {
            background: #f59e0b;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-cancelled {
            background: #ef4444;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-period {
            background: #3b82f6;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        body.dark .empty-state {
            color: #8b949e;
        }

        .empty-state .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        /* Checkbox */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: #1a1a2e;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        .toast.success {
            background: #10b981;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f0f2f5;
        }

        body.dark ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 10px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px 12px 80px;
            }
            .header h1 {
                font-size: 18px;
            }
            .tabs {
                gap: 4px;
                padding: 4px;
            }
            .tab-btn {
                padding: 8px 10px;
                font-size: 12px;
            }
            .form-card {
                padding: 12px;
            }
            .form-card .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <div class="header">
            <h1>🛠 Админ-панель</h1>
            <button class="close-btn" onclick="window.location.href='/'">✕ Закрыть</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('groups')">📚 Группы</button>
            <button class="tab-btn" onclick="switchTab('teachers')">👨‍🏫 Преподаватели</button>
            <button class="tab-btn" onclick="switchTab('classrooms')">🏫 Аудитории</button>
            <button class="tab-btn" onclick="switchTab('lessons')">📅 Пары</button>
            <button class="tab-btn" onclick="switchTab('replacements')">🔄 Замены</button>
        </div>

        <!-- ==================== TAB: GROUPS ==================== -->
        <div class="tab-content active" id="tab-groups">
            <div class="form-card">
                <input type="text" id="groupName" placeholder="Название группы (например: ИВТ-21)">
                <input type="text" id="groupFaculty" placeholder="Факультет (необязательно)">
                <button class="btn-add" onclick="addGroup()">➕ Добавить группу</button>
            </div>
            <div id="groupsList"></div>
        </div>

        <!-- ==================== TAB: TEACHERS ==================== -->
        <div class="tab-content" id="tab-teachers">
            <div class="form-card">
                <input type="text" id="teacherName" placeholder="ФИО преподавателя (например: Иванов И.И.)">
                <input type="text" id="teacherDepartment" placeholder="Кафедра (необязательно)">
                <button class="btn-add" onclick="addTeacher()">➕ Добавить преподавателя</button>
            </div>
            <div id="teachersList"></div>
        </div>

        <!-- ==================== TAB: CLASSROOMS ==================== -->
        <div class="tab-content" id="tab-classrooms">
            <div class="form-card">
                <input type="text" id="classroomNumber" placeholder="Номер аудитории (например: 301)">
                <input type="text" id="classroomBuilding" placeholder="Корпус (необязательно)">
                <button class="btn-add" onclick="addClassroom()">➕ Добавить аудиторию</button>
            </div>
            <div id="classroomsList"></div>
        </div>

        <!-- ==================== TAB: LESSONS ==================== -->
        <div class="tab-content" id="tab-lessons">
            <div class="form-card">
                <select id="lessonGroup"></select>
                <select id="lessonTeacher"></select>
                <select id="lessonClassroom"></select>
                <input type="text" id="lessonSubject" placeholder="Название предмета">
                <div class="row">
                    <select id="lessonType">
                        <option value="Лекция">Лекция</option>
                        <option value="Практика">Практика</option>
                        <option value="Лабораторная">Лабораторная</option>
                        <option value="Семинар">Семинар</option>
                    </select>
                    <input type="time" id="lessonStart" value="08:30">
                </div>
                <div class="row">
                    <input type="time" id="lessonEnd" value="10:00">
                    <select id="lessonDay">
                        <option value="0">Пн</option>
                        <option value="1">Вт</option>
                        <option value="2">Ср</option>
                        <option value="3">Чт</option>
                        <option value="4">Пт</option>
                        <option value="5">Сб</option>
                        <option value="6">Вс</option>
                    </select>
                </div>
                <select id="lessonWeek">
                    <option value="0">Четная неделя</option>
                    <option value="1">Нечетная неделя</option>
                </select>

                <!-- ===== ПЕРИОД ДЕЙСТВИЯ ===== -->
                <div class="section-divider">
                    <label>📅 Период действия пары</label>
                    <div class="row">
                        <input type="date" id="lessonDateFrom" placeholder="Дата начала">
                        <input type="date" id="lessonDateTo" placeholder="Дата окончания">
                    </div>
                    <div class="hint">Оставьте пустым для регулярной пары на весь семестр</div>
                    
                    <label style="margin-top:12px;">📌 Или конкретная дата (разовое занятие)</label>
                    <input type="date" id="lessonSpecificDate" style="margin-bottom:4px;">
                    <div class="hint">Заполните только для разовой пары в конкретный день</div>
                </div>

                <button class="btn-add" onclick="addLesson()">➕ Добавить пару</button>
            </div>
            <div id="lessonsList"></div>
        </div>

        <!-- ==================== TAB: REPLACEMENTS ==================== -->
        <div class="tab-content" id="tab-replacements">
            <div class="form-card">
                <select id="repGroup" onchange="loadLessonsForReplacement()">
                    <option value="">Выберите группу</option>
                </select>
                <select id="repLesson" onchange="loadCurrentReplacement()">
                    <option value="">Выберите пару</option>
                </select>
                <input type="date" id="repDate" onchange="loadCurrentReplacement()">
                
                <div class="section-divider">
                    <h4 style="margin-bottom:8px;">📝 Данные замены</h4>
                    <input type="text" id="repNewSubject" placeholder="Новый предмет (оставьте пустым, если без изменений)">
                    <select id="repNewTeacher">
                        <option value="">Новый преподаватель</option>
                    </select>
                    <select id="repNewClassroom">
                        <option value="">Новая аудитория</option>
                    </select>
                    <div class="row">
                        <input type="time" id="repNewStart" placeholder="Новое время начала">
                        <input type="time" id="repNewEnd" placeholder="Новое время окончания">
                    </div>
                    <input type="text" id="repNote" placeholder="Примечание (например: перенос)">
                    <div class="checkbox-row">
                        <input type="checkbox" id="repIsCancelled">
                        <label for="repIsCancelled">❌ Отменить пару</label>
                    </div>
                </div>
                
                <button class="btn-add" onclick="saveReplacement()">💾 Сохранить замену</button>
                <button class="btn-add btn-danger" onclick="deleteReplacement()" id="deleteRepBtn" style="display:none;">🗑 Удалить замену</button>
            </div>
            <div id="replacementsList"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const ADMIN_ID = 5028080287;

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ============================================
        // TABS
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            const today = new Date().toISOString().split('T')[0];
            
            if (tab === 'lessons') {
                loadLessons();
                document.getElementById('lessonSpecificDate').value = today;
                document.getElementById('lessonDateFrom').value = '';
                document.getElementById('lessonDateTo').value = '';
            }
            if (tab === 'groups') loadGroups();
            if (tab === 'teachers') loadTeachers();
            if (tab === 'classrooms') loadClassrooms();
            if (tab === 'replacements') {
                loadGroupsForReplacement();
                loadTeachersForReplacement();
                loadClassroomsForReplacement();
                loadReplacementsList();
                document.getElementById('repDate').value = today;
            }
        }

        // ============================================
        // GROUPS
        // ============================================
        async function loadGroups() {
            try {
                const res = await fetch('/api/groups');
                const data = await res.json();
                const container = document.getElementById('groupsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>Нет групп</div>`;
                    return;
                }
                container.innerHTML = data.map(g => `
                    <div class="list-item">
                        <div class="info">
                            <span class="title">${g.name}</span>
                            <span class="sub">${g.faculty || 'Основной'}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteGroup(${g.id})">🗑</button>
                    </div>
                `).join('');
                updateLessonSelects();
                updateGroupSelects();
            } catch (e) {
                showToast('Ошибка загрузки групп', 'error');
            }
        }

        async function addGroup() {
            const name = document.getElementById('groupName').value.trim();
            const faculty = document.getElementById('groupFaculty').value.trim();
            if (!name) { showToast('Введите название группы', 'error'); return; }
            try {
                await fetch('/admin/api/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, faculty })
                });
                document.getElementById('groupName').value = '';
                document.getElementById('groupFaculty').value = '';
                showToast('Группа добавлена!');
                loadGroups();
            } catch (e) {
                showToast('Ошибка добавления', 'error');
            }
        }

        async function deleteGroup(id) {
            if (!confirm('Удалить группу?')) return;
            try {
                await fetch(`/admin/api/groups/${id}`, { method: 'DELETE' });
                showToast('Группа удалена');
                loadGroups();
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================
        // TEACHERS
        // ============================================
        async function loadTeachers() {
            try {
                const res = await fetch('/api/teachers');
                const data = await res.json();
                const container = document.getElementById('teachersList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">👨‍🏫</span>Нет преподавателей</div>`;
                    return;
                }
                container.innerHTML = data.map(t => `
                    <div class="list-item">
                        <div class="info">
                            <span class="title">${t.name}</span>
                            <span class="sub">${t.department || 'Кафедра'}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTeacher(${t.id})">🗑</button>
                    </div>
                `).join('');
                updateLessonSelects();
            } catch (e) {
                showToast('Ошибка загрузки преподавателей', 'error');
            }
        }

        async function addTeacher() {
            const name = document.getElementById('teacherName').value.trim();
            const department = document.getElementById('teacherDepartment').value.trim();
            if (!name) { showToast('Введите ФИО преподавателя', 'error'); return; }
            try {
                await fetch('/admin/api/teachers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, department })
                });
                document.getElementById('teacherName').value = '';
                document.getElementById('teacherDepartment').value = '';
                showToast('Преподаватель добавлен!');
                loadTeachers();
            } catch (e) {
                showToast('Ошибка добавления', 'error');
            }
        }

        async function deleteTeacher(id) {
            if (!confirm('Удалить преподавателя?')) return;
            try {
                await fetch(`/admin/api/teachers/${id}`, { method: 'DELETE' });
                showToast('Преподаватель удален');
                loadTeachers();
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================
        // CLASSROOMS
        // ============================================
        async function loadClassrooms() {
            try {
                const res = await fetch('/api/classrooms');
                const data = await res.json();
                const container = document.getElementById('classroomsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">🏫</span>Нет аудиторий</div>`;
                    return;
                }
                container.innerHTML = data.map(c => `
                    <div class="list-item">
                        <div class="info">
                            <span class="title">Ауд. ${c.number}</span>
                            <span class="sub">${c.building || 'Главный корпус'}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteClassroom(${c.id})">🗑</button>
                    </div>
                `).join('');
                updateLessonSelects();
            } catch (e) {
                showToast('Ошибка загрузки аудиторий', 'error');
            }
        }

        async function addClassroom() {
            const number = document.getElementById('classroomNumber').value.trim();
            const building = document.getElementById('classroomBuilding').value.trim();
            if (!number) { showToast('Введите номер аудитории', 'error'); return; }
            try {
                await fetch('/admin/api/classrooms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, building })
                });
                document.getElementById('classroomNumber').value = '';
                document.getElementById('classroomBuilding').value = '';
                showToast('Аудитория добавлена!');
                loadClassrooms();
            } catch (e) {
                showToast('Ошибка добавления', 'error');
            }
        }

        async function deleteClassroom(id) {
            if (!confirm('Удалить аудиторию?')) return;
            try {
                await fetch(`/admin/api/classrooms/${id}`, { method: 'DELETE' });
                showToast('Аудитория удалена');
                loadClassrooms();
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================
        // LESSONS (с date_from, date_to, specific_date)
        // ============================================
        async function loadLessons() {
            const groupId = document.getElementById('lessonGroup')?.value;
            if (!groupId) {
                document.getElementById('lessonsList').innerHTML = `<div class="empty-state"><span class="emoji">📅</span>Выберите группу</div>`;
                return;
            }
            try {
                const res = await fetch(`/api/lessons?group_id=${groupId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const container = document.getElementById('lessonsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>Нет пар</div>`;
                    return;
                }
                const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                container.innerHTML = data.map(l => {
                    let badges = '';
                    let periodText = '';
                    
                    if (l.is_specific) {
                        badges += `<span class="badge-specific">📅 ${l.specific_date}</span>`;
                    } else if (l.has_period) {
                        if (l.date_from && l.date_to) {
                            periodText = `${l.date_from} → ${l.date_to}`;
                        } else if (l.date_from) {
                            periodText = `с ${l.date_from}`;
                        } else if (l.date_to) {
                            periodText = `до ${l.date_to}`;
                        }
                        badges += `<span class="badge-period">📆 ${periodText}</span>`;
                    }
                    
                    return `
                        <div class="list-item">
                            <div class="info">
                                <span class="title">${l.start_time} - ${l.subject}</span>
                                <span class="sub">
                                    👨‍🏫 ${l.teacher} • 🏫 ${l.classroom} 
                                    • ${days[l.day_of_week]} 
                                    ${l.week_type === 0 ? 'Четная' : 'Нечетная'}
                                    ${badges}
                                </span>
                            </div>
                            <button class="delete-btn" onclick="deleteLesson(${l.id})">🗑</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error('Error loading lessons:', e);
                document.getElementById('lessonsList').innerHTML = `
                    <div class="empty-state" style="color:#ef4444;">
                        <span class="emoji">❌</span>
                        Ошибка загрузки: ${e.message}
                    </div>
                `;
            }
        }

        async function addLesson() {
            const specificDate = document.getElementById('lessonSpecificDate').value || null;
            const dateFrom = document.getElementById('lessonDateFrom').value || null;
            const dateTo = document.getElementById('lessonDateTo').value || null;
            
            // Проверяем корректность периода
            if (dateFrom && dateTo && dateFrom > dateTo) {
                showToast('Дата начала не может быть позже даты окончания', 'error');
                return;
            }
            
            const data = {
                group_id: parseInt(document.getElementById('lessonGroup').value),
                teacher_id: parseInt(document.getElementById('lessonTeacher').value),
                classroom_id: parseInt(document.getElementById('lessonClassroom').value),
                subject: document.getElementById('lessonSubject').value.trim(),
                lesson_type: document.getElementById('lessonType').value,
                start_time: document.getElementById('lessonStart').value,
                end_time: document.getElementById('lessonEnd').value,
                day_of_week: parseInt(document.getElementById('lessonDay').value),
                week_type: parseInt(document.getElementById('lessonWeek').value),
                is_online: false,
                specific_date: specificDate,
                date_from: dateFrom,
                date_to: dateTo
            };

            if (!data.subject) { showToast('Введите название предмета', 'error'); return; }
            if (!data.start_time || !data.end_time) { showToast('Введите время', 'error'); return; }

            try {
                const res = await fetch('/admin/api/lessons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (res.ok) {
                    document.getElementById('lessonSubject').value = '';
                    document.getElementById('lessonSpecificDate').value = '';
                    document.getElementById('lessonDateFrom').value = '';
                    document.getElementById('lessonDateTo').value = '';
                    
                    let msg = '✅ Пара добавлена!';
                    if (specificDate) msg = '✅ Разовое занятие добавлено!';
                    else if (dateFrom || dateTo) msg = '✅ Пара с периодом действия добавлена!';
                    
                    showToast(msg);
                    loadLessons();
                } else {
                    showToast('❌ Ошибка: ' + (result.detail || 'Неизвестная ошибка'), 'error');
                }
            } catch (e) {
                showToast('❌ Ошибка добавления пары', 'error');
            }
        }

        async function deleteLesson(id) {
            if (!confirm('Удалить пару?')) return;
            try {
                await fetch(`/admin/api/lessons/${id}`, { method: 'DELETE' });
                showToast('Пара удалена');
                loadLessons();
            } catch (e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================
        // REPLACEMENTS
        // ============================================
        let currentReplacementId = null;

        async function loadGroupsForReplacement() {
            try {
                const res = await fetch('/api/groups');
                const groups = await res.json();
                const select = document.getElementById('repGroup');
                select.innerHTML = '<option value="">Выберите группу</option>' + 
                    groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            } catch(e) {}
        }

        async function loadTeachersForReplacement() {
            try {
                const res = await fetch('/api/teachers');
                const teachers = await res.json();
                const select = document.getElementById('repNewTeacher');
                select.innerHTML = '<option value="">Новый преподаватель</option>' + 
                    teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            } catch(e) {}
        }

        async function loadClassroomsForReplacement() {
            try {
                const res = await fetch('/api/classrooms');
                const classrooms = await res.json();
                const select = document.getElementById('repNewClassroom');
                select.innerHTML = '<option value="">Новая аудитория</option>' + 
                    classrooms.map(c => `<option value="${c.id}">${c.number}</option>`).join('');
            } catch(e) {}
        }

        async function loadLessonsForReplacement() {
            const groupId = document.getElementById('repGroup').value;
            const select = document.getElementById('repLesson');
            if (!groupId) {
                select.innerHTML = '<option value="">Выберите пару</option>';
                return;
            }
            try {
                const res = await fetch(`/api/lessons?group_id=${groupId}`);
                const lessons = await res.json();
                select.innerHTML = '<option value="">Выберите пару</option>' + 
                    lessons.map(l => `<option value="${l.id}">${l.start_time} - ${l.subject}</option>`).join('');
            } catch(e) {
                console.error('Error loading lessons for replacement:', e);
            }
        }

        async function loadCurrentReplacement() {
            const lessonId = document.getElementById('repLesson').value;
            const dateStr = document.getElementById('repDate').value;
            
            if (!lessonId || !dateStr) {
                document.getElementById('deleteRepBtn').style.display = 'none';
                currentReplacementId = null;
                return;
            }

            try {
                const res = await fetch(`/api/replacements/${lessonId}/${dateStr}`);
                const data = await res.json();
                
                if (data && data.id) {
                    currentReplacementId = data.id;
                    document.getElementById('deleteRepBtn').style.display = 'block';
                    document.getElementById('repNewSubject').value = data.new_subject || '';
                    document.getElementById('repNewTeacher').value = data.new_teacher_id || '';
                    document.getElementById('repNewClassroom').value = data.new_classroom_id || '';
                    document.getElementById('repNewStart').value = data.new_start_time || '';
                    document.getElementById('repNewEnd').value = data.new_end_time || '';
                    document.getElementById('repNote').value = data.note || '';
                    document.getElementById('repIsCancelled').checked = data.is_cancelled || false;
                } else {
                    document.getElementById('deleteRepBtn').style.display = 'none';
                    currentReplacementId = null;
                    document.getElementById('repNewSubject').value = '';
                    document.getElementById('repNewTeacher').value = '';
                    document.getElementById('repNewClassroom').value = '';
                    document.getElementById('repNewStart').value = '';
                    document.getElementById('repNewEnd').value = '';
                    document.getElementById('repNote').value = '';
                    document.getElementById('repIsCancelled').checked = false;
                }
            } catch(e) {
                console.error('Error loading replacement:', e);
            }
        }

        async function saveReplacement() {
            const lessonId = document.getElementById('repLesson').value;
            const dateStr = document.getElementById('repDate').value;
            
            if (!lessonId) { showToast('Выберите пару', 'error'); return; }
            if (!dateStr) { showToast('Выберите дату', 'error'); return; }

            const data = {
                lesson_id: parseInt(lessonId),
                replacement_date: dateStr,
                new_subject: document.getElementById('repNewSubject').value.trim() || null,
                new_teacher_id: document.getElementById('repNewTeacher').value || null,
                new_classroom_id: document.getElementById('repNewClassroom').value || null,
                new_start_time: document.getElementById('repNewStart').value || null,
                new_end_time: document.getElementById('repNewEnd').value || null,
                note: document.getElementById('repNote').value.trim() || null,
                is_cancelled: document.getElementById('repIsCancelled').checked
            };

            try {
                const res = await fetch('/admin/api/replacements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    showToast(result.updated ? 'Замена обновлена!' : 'Замена создана!');
                    loadReplacementsList();
                    loadCurrentReplacement();
                } else {
                    showToast('❌ Ошибка: ' + (result.detail || 'Неизвестная ошибка'), 'error');
                }
            } catch(e) {
                showToast('Ошибка сохранения замены', 'error');
            }
        }

        async function deleteReplacement() {
            if (!currentReplacementId) { showToast('Нет замены для удаления', 'error'); return; }
            if (!confirm('Удалить замену?')) return;
            
            try {
                await fetch(`/admin/api/replacements/${currentReplacementId}`, { method: 'DELETE' });
                showToast('Замена удалена');
                document.getElementById('deleteRepBtn').style.display = 'none';
                currentReplacementId = null;
                loadReplacementsList();
                document.getElementById('repNewSubject').value = '';
                document.getElementById('repNewTeacher').value = '';
                document.getElementById('repNewClassroom').value = '';
                document.getElementById('repNewStart').value = '';
                document.getElementById('repNewEnd').value = '';
                document.getElementById('repNote').value = '';
                document.getElementById('repIsCancelled').checked = false;
            } catch(e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        async function loadReplacementsList() {
            const container = document.getElementById('replacementsList');
            try {
                const res = await fetch('/api/replacements/all');
                const data = await res.json();
                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">🔄</span>
                            <span>Нет замен</span>
                        </div>
                    `;
                    return;
                }
                container.innerHTML = data.map(r => `
                    <div class="list-item">
                        <div class="info">
                            <span class="title">📅 ${r.replacement_date} • ${r.group}</span>
                            <span class="sub">
                                ${r.subject} 
                                ${r.is_cancelled ? '<span class="badge-cancelled">❌ Отменена</span>' : ''}
                                ${r.new_subject ? `→ ${r.new_subject}` : ''}
                                ${r.note ? `📌 ${r.note}` : ''}
                            </span>
                        </div>
                        <button class="delete-btn" onclick="deleteReplacementById(${r.id})">🗑</button>
                    </div>
                `).join('');
            } catch(e) {
                console.error('Error loading replacements:', e);
            }
        }

        async function deleteReplacementById(id) {
            if (!confirm('Удалить замену?')) return;
            try {
                await fetch(`/admin/api/replacements/${id}`, { method: 'DELETE' });
                showToast('Замена удалена');
                loadReplacementsList();
            } catch(e) {
                showToast('Ошибка удаления', 'error');
            }
        }

        // ============================================
        // UPDATE SELECTS
        // ============================================
        async function updateLessonSelects() {
            try {
                const groupsRes = await fetch('/api/groups');
                const groups = await groupsRes.json();
                const groupSelect = document.getElementById('lessonGroup');
                groupSelect.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

                const teachersRes = await fetch('/api/teachers');
                const teachers = await teachersRes.json();
                const teacherSelect = document.getElementById('lessonTeacher');
                teacherSelect.innerHTML = teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

                const classroomsRes = await fetch('/api/classrooms');
                const classrooms = await classroomsRes.json();
                const classroomSelect = document.getElementById('lessonClassroom');
                classroomSelect.innerHTML = classrooms.map(c => `<option value="${c.id}">${c.number}</option>`).join('');

                if (groupSelect.value) loadLessons();
            } catch (e) {
                console.error('Error updating selects:', e);
            }
        }

        async function updateGroupSelects() {
            try {
                const res = await fetch('/api/groups');
                const groups = await res.json();
                const select = document.getElementById('repGroup');
                const currentValue = select.value;
                select.innerHTML = '<option value="">Выберите группу</option>' + 
                    groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                if (currentValue) select.value = currentValue;
            } catch(e) {}
        }

        // ============================================
        // INIT
        // ============================================
        async function init() {
            const tg = window.Telegram?.WebApp;
            const userId = tg?.initDataUnsafe?.user?.id || 5028080287;
            
            if (userId !== ADMIN_ID) {
                document.body.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;">
                        <div style="font-size:60px;margin-bottom:16px;">⛔</div>
                        <h2 style="font-size:24px;margin-bottom:8px;">Доступ запрещен</h2>
                        <p style="color:#718096;">Только для администраторов</p>
                    </div>
                `;
                return;
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('repDate').value = today;
            document.getElementById('lessonSpecificDate').value = today;

            await loadGroups();
            await loadTeachers();
            await loadClassrooms();
            await updateLessonSelects();
            await loadGroupsForReplacement();
            await loadTeachersForReplacement();
            await loadClassroomsForReplacement();
        }

        init();
    </script>
