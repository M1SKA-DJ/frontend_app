<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛠 Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            padding: 16px 20px 100px;
            min-height: 100vh;
        }

        body.dark {
            background: #0d1117;
            color: #e6edf3;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        body.dark .header {
            border-bottom-color: #30363d;
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .close-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: #ef4444;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: white;
            padding: 6px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body.dark .tabs {
            background: #161b22;
        }

        .tab-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        body.dark .tab-btn {
            color: #8b949e;
        }

        .tab-btn.active {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-card {
            background: white;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        body.dark .form-card {
            background: #161b22;
        }

        .form-card input,
        .form-card select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 8px;
            background: #f7fafc;
            color: #1a1a2e;
            transition: all 0.2s;
        }

        body.dark .form-card input,
        body.dark .form-card select {
            background: #0d1117;
            border-color: #30363d;
            color: #e6edf3;
        }

        .form-card input:focus,
        .form-card select:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .form-card .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-card .btn-add {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .form-card .btn-add:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .form-card .btn-danger {
            background: #ef4444;
        }

        .form-card .section-divider {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }

        body.dark .form-card .section-divider {
            border-top-color: #30363d;
        }

        .form-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        body.dark .form-card label {
            color: #8b949e;
        }

        .form-card .hint {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        body.dark .form-card .hint {
            color: #8b949e;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        body.dark .list-item {
            background: #161b22;
        }

        .list-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .list-item .info .title {
            font-weight: 600;
            font-size: 15px;
        }

        .list-item .info .sub {
            font-size: 13px;
            color: #718096;
        }

        body.dark .list-item .info .sub {
            color: #8b949e;
        }

        .list-item .delete-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .badge-specific {
            background: #8b5cf6;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-period {
            background: #3b82f6;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-cancelled {
            background: #ef4444;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        body.dark .empty-state {
            color: #8b949e;
        }

        .empty-state .emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-row label {
            margin: 0;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: #1a1a2e;
            color: white;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        .toast.success {
            background: #10b981;
        }

        .toast.error {
            background: #ef4444;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 12px 80px;
            }
            .header h1 {
                font-size: 18px;
            }
            .tab-btn {
                padding: 8px 10px;
                font-size: 12px;
            }
            .form-card .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠 Админ-панель</h1>
        <button class="close-btn" onclick="window.location.href='/'">✕ Закрыть</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('groups')">📚 Группы</button>
        <button class="tab-btn" onclick="switchTab('teachers')">👨‍🏫 Преподаватели</button>
        <button class="tab-btn" onclick="switchTab('classrooms')">🏫 Аудитории</button>
        <button class="tab-btn" onclick="switchTab('lessons')">📅 Пары</button>
        <button class="tab-btn" onclick="switchTab('replacements')">🔄 Замены</button>
    </div>

    <!-- GROUPS -->
    <div class="tab-content active" id="tab-groups">
        <div class="form-card">
            <input type="text" id="groupName" placeholder="Название группы">
            <input type="text" id="groupFaculty" placeholder="Факультет">
            <button class="btn-add" onclick="addGroup()">➕ Добавить группу</button>
        </div>
        <div id="groupsList"></div>
    </div>

    <!-- TEACHERS -->
    <div class="tab-content" id="tab-teachers">
        <div class="form-card">
            <input type="text" id="teacherName" placeholder="ФИО преподавателя">
            <input type="text" id="teacherDepartment" placeholder="Кафедра">
            <button class="btn-add" onclick="addTeacher()">➕ Добавить преподавателя</button>
        </div>
        <div id="teachersList"></div>
    </div>

    <!-- CLASSROOMS -->
    <div class="tab-content" id="tab-classrooms">
        <div class="form-card">
            <input type="text" id="classroomNumber" placeholder="Номер аудитории">
            <input type="text" id="classroomBuilding" placeholder="Корпус">
            <button class="btn-add" onclick="addClassroom()">➕ Добавить аудиторию</button>
        </div>
        <div id="classroomsList"></div>
    </div>

    <!-- LESSONS -->
    <div class="tab-content" id="tab-lessons">
        <div class="form-card">
            <select id="lessonGroup"></select>
            <select id="lessonTeacher"></select>
            <select id="lessonClassroom"></select>
            <input type="text" id="lessonSubject" placeholder="Название предмета">
            <div class="row">
                <select id="lessonType">
                    <option value="Лекция">Лекция</option>
                    <option value="Практика">Практика</option>
                    <option value="Лабораторная">Лабораторная</option>
                </select>
                <input type="time" id="lessonStart" value="08:30">
            </div>
            <div class="row">
                <input type="time" id="lessonEnd" value="10:00">
                <select id="lessonDay">
                    <option value="0">Пн</option>
                    <option value="1">Вт</option>
                    <option value="2">Ср</option>
                    <option value="3">Чт</option>
                    <option value="4">Пт</option>
                    <option value="5">Сб</option>
                    <option value="6">Вс</option>
                </select>
            </div>
            <select id="lessonWeek">
                <option value="0">Четная</option>
                <option value="1">Нечетная</option>
            </select>
            <div class="section-divider">
                <label>📅 Период действия</label>
                <div class="row">
                    <input type="date" id="lessonDateFrom">
                    <input type="date" id="lessonDateTo">
                </div>
                <div class="hint">Оставьте пустым для регулярной пары</div>
                <label>📌 Конкретная дата</label>
                <input type="date" id="lessonSpecificDate">
                <div class="hint">Для разового занятия</div>
            </div>
            <button class="btn-add" onclick="addLesson()">➕ Добавить пару</button>
        </div>
        <div id="lessonsList"></div>
    </div>

    <!-- REPLACEMENTS -->
    <div class="tab-content" id="tab-replacements">
        <div class="form-card">
            <select id="repGroup" onchange="loadLessonsForReplacement()">
                <option value="">Выберите группу</option>
            </select>
            <select id="repLesson" onchange="loadCurrentReplacement()">
                <option value="">Выберите пару</option>
            </select>
            <input type="date" id="repDate" onchange="loadCurrentReplacement()">
            <div class="section-divider">
                <h4>📝 Данные замены</h4>
                <input type="text" id="repNewSubject" placeholder="Новый предмет">
                <select id="repNewTeacher"><option value="">Новый преподаватель</option></select>
                <select id="repNewClassroom"><option value="">Новая аудитория</option></select>
                <div class="row">
                    <input type="time" id="repNewStart" placeholder="Время начала">
                    <input type="time" id="repNewEnd" placeholder="Время окончания">
                </div>
                <input type="text" id="repNote" placeholder="Примечание">
                <div class="checkbox-row">
                    <input type="checkbox" id="repIsCancelled">
                    <label for="repIsCancelled">❌ Отменить пару</label>
                </div>
            </div>
            <button class="btn-add" onclick="saveReplacement()">💾 Сохранить замену</button>
            <button class="btn-add btn-danger" onclick="deleteReplacement()" id="deleteRepBtn" style="display:none;">🗑 Удалить</button>
        </div>
        <div id="replacementsList"></div>
    </div>

    <script>
        // ============ КОНФИГ ============
        const ADMIN_ID = 5028080287;

        // ============ TOAST ============
        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ============ TABS ============
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            const today = new Date().toISOString().split('T')[0];
            if (tab === 'lessons') { loadLessons(); document.getElementById('lessonSpecificDate').value = today; }
            if (tab === 'groups') loadGroups();
            if (tab === 'teachers') loadTeachers();
            if (tab === 'classrooms') loadClassrooms();
            if (tab === 'replacements') {
                loadGroupsForReplacement();
                loadTeachersForReplacement();
                loadClassroomsForReplacement();
                loadReplacementsList();
                document.getElementById('repDate').value = today;
            }
        }

        // ============ GROUPS ============
        async function loadGroups() {
            try {
                const res = await fetch('/api/groups');
                const data = await res.json();
                const container = document.getElementById('groupsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>Нет групп</div>`;
                    return;
                }
                container.innerHTML = data.map(g => `
                    <div class="list-item">
                        <div class="info"><span class="title">${g.name}</span><span class="sub">${g.faculty || 'Основной'}</span></div>
                        <button class="delete-btn" onclick="deleteGroup(${g.id})">🗑</button>
                    </div>
                `).join('');
                updateSelects();
            } catch(e) { showToast('Ошибка загрузки групп', 'error'); }
        }

        async function addGroup() {
            const name = document.getElementById('groupName').value.trim();
            const faculty = document.getElementById('groupFaculty').value.trim();
            if (!name) { showToast('Введите название группы', 'error'); return; }
            await fetch('/admin/api/groups', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, faculty })
            });
            document.getElementById('groupName').value = '';
            document.getElementById('groupFaculty').value = '';
            showToast('Группа добавлена!');
            loadGroups();
        }

        async function deleteGroup(id) {
            if (!confirm('Удалить группу?')) return;
            await fetch(`/admin/api/groups/${id}`, { method: 'DELETE' });
            showToast('Группа удалена');
            loadGroups();
        }

        // ============ TEACHERS ============
        async function loadTeachers() {
            try {
                const res = await fetch('/api/teachers');
                const data = await res.json();
                const container = document.getElementById('teachersList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">👨‍🏫</span>Нет преподавателей</div>`;
                    return;
                }
                container.innerHTML = data.map(t => `
                    <div class="list-item">
                        <div class="info"><span class="title">${t.name}</span><span class="sub">${t.department || 'Кафедра'}</span></div>
                        <button class="delete-btn" onclick="deleteTeacher(${t.id})">🗑</button>
                    </div>
                `).join('');
                updateSelects();
            } catch(e) { showToast('Ошибка загрузки преподавателей', 'error'); }
        }

        async function addTeacher() {
            const name = document.getElementById('teacherName').value.trim();
            const dept = document.getElementById('teacherDepartment').value.trim();
            if (!name) { showToast('Введите ФИО преподавателя', 'error'); return; }
            await fetch('/admin/api/teachers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, department: dept })
            });
            document.getElementById('teacherName').value = '';
            document.getElementById('teacherDepartment').value = '';
            showToast('Преподаватель добавлен!');
            loadTeachers();
        }

        async function deleteTeacher(id) {
            if (!confirm('Удалить преподавателя?')) return;
            await fetch(`/admin/api/teachers/${id}`, { method: 'DELETE' });
            showToast('Преподаватель удален');
            loadTeachers();
        }

        // ============ CLASSROOMS ============
        async function loadClassrooms() {
            try {
                const res = await fetch('/api/classrooms');
                const data = await res.json();
                const container = document.getElementById('classroomsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">🏫</span>Нет аудиторий</div>`;
                    return;
                }
                container.innerHTML = data.map(c => `
                    <div class="list-item">
                        <div class="info"><span class="title">Ауд. ${c.number}</span><span class="sub">${c.building || 'Главный'}</span></div>
                        <button class="delete-btn" onclick="deleteClassroom(${c.id})">🗑</button>
                    </div>
                `).join('');
                updateSelects();
            } catch(e) { showToast('Ошибка загрузки аудиторий', 'error'); }
        }

        async function addClassroom() {
            const number = document.getElementById('classroomNumber').value.trim();
            const building = document.getElementById('classroomBuilding').value.trim();
            if (!number) { showToast('Введите номер аудитории', 'error'); return; }
            await fetch('/admin/api/classrooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number, building })
            });
            document.getElementById('classroomNumber').value = '';
            document.getElementById('classroomBuilding').value = '';
            showToast('Аудитория добавлена!');
            loadClassrooms();
        }

        async function deleteClassroom(id) {
            if (!confirm('Удалить аудиторию?')) return;
            await fetch(`/admin/api/classrooms/${id}`, { method: 'DELETE' });
            showToast('Аудитория удалена');
            loadClassrooms();
        }

        // ============ LESSONS ============
        async function loadLessons() {
            const groupId = document.getElementById('lessonGroup').value;
            if (!groupId) {
                document.getElementById('lessonsList').innerHTML = `<div class="empty-state"><span class="emoji">📅</span>Выберите группу</div>`;
                return;
            }
            try {
                const res = await fetch(`/api/lessons?group_id=${groupId}`);
                const data = await res.json();
                const container = document.getElementById('lessonsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>Нет пар</div>`;
                    return;
                }
                const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                container.innerHTML = data.map(l => {
                    let badge = '';
                    if (l.is_specific) badge = `<span class="badge-specific">📅 ${l.specific_date}</span>`;
                    else if (l.has_period) {
                        let p = '';
                        if (l.date_from && l.date_to) p = `${l.date_from} → ${l.date_to}`;
                        else if (l.date_from) p = `с ${l.date_from}`;
                        else if (l.date_to) p = `до ${l.date_to}`;
                        badge = `<span class="badge-period">📆 ${p}</span>`;
                    }
                    return `
                        <div class="list-item">
                            <div class="info">
                                <span class="title">${l.start_time} - ${l.subject}</span>
                                <span class="sub">👨‍🏫 ${l.teacher} • 🏫 ${l.classroom} • ${days[l.day_of_week]} ${l.week_type === 0 ? 'Четная' : 'Нечетная'} ${badge}</span>
                            </div>
                            <button class="delete-btn" onclick="deleteLesson(${l.id})">🗑</button>
                        </div>
                    `;
                }).join('');
            } catch(e) { showToast('Ошибка загрузки пар', 'error'); }
        }

        async function addLesson() {
            const data = {
                group_id: parseInt(document.getElementById('lessonGroup').value),
                teacher_id: parseInt(document.getElementById('lessonTeacher').value),
                classroom_id: parseInt(document.getElementById('lessonClassroom').value),
                subject: document.getElementById('lessonSubject').value.trim(),
                lesson_type: document.getElementById('lessonType').value,
                start_time: document.getElementById('lessonStart').value,
                end_time: document.getElementById('lessonEnd').value,
                day_of_week: parseInt(document.getElementById('lessonDay').value),
                week_type: parseInt(document.getElementById('lessonWeek').value),
                is_online: false,
                specific_date: document.getElementById('lessonSpecificDate').value || null,
                date_from: document.getElementById('lessonDateFrom').value || null,
                date_to: document.getElementById('lessonDateTo').value || null
            };
            if (!data.subject) { showToast('Введите название предмета', 'error'); return; }
            if (!data.start_time || !data.end_time) { showToast('Введите время', 'error'); return; }
            if (data.date_from && data.date_to && data.date_from > data.date_to) {
                showToast('Дата начала не может быть позже окончания', 'error');
                return;
            }
            await fetch('/admin/api/lessons', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            document.getElementById('lessonSubject').value = '';
            document.getElementById('lessonSpecificDate').value = '';
            document.getElementById('lessonDateFrom').value = '';
            document.getElementById('lessonDateTo').value = '';
            showToast('Пара добавлена!');
            loadLessons();
        }

        async function deleteLesson(id) {
            if (!confirm('Удалить пару?')) return;
            await fetch(`/admin/api/lessons/${id}`, { method: 'DELETE' });
            showToast('Пара удалена');
            loadLessons();
        }

        // ============ REPLACEMENTS ============
        let currentReplacementId = null;

        async function loadGroupsForReplacement() {
            const res = await fetch('/api/groups');
            const groups = await res.json();
            const select = document.getElementById('repGroup');
            select.innerHTML = '<option value="">Выберите группу</option>' + groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        async function loadTeachersForReplacement() {
            const res = await fetch('/api/teachers');
            const teachers = await res.json();
            const select = document.getElementById('repNewTeacher');
            select.innerHTML = '<option value="">Новый преподаватель</option>' + teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        }

        async function loadClassroomsForReplacement() {
            const res = await fetch('/api/classrooms');
            const classrooms = await res.json();
            const select = document.getElementById('repNewClassroom');
            select.innerHTML = '<option value="">Новая аудитория</option>' + classrooms.map(c => `<option value="${c.id}">${c.number}</option>`).join('');
        }

        async function loadLessonsForReplacement() {
            const groupId = document.getElementById('repGroup').value;
            const select = document.getElementById('repLesson');
            if (!groupId) { select.innerHTML = '<option value="">Выберите пару</option>'; return; }
            const res = await fetch(`/api/lessons?group_id=${groupId}`);
            const lessons = await res.json();
            select.innerHTML = '<option value="">Выберите пару</option>' + lessons.map(l => `<option value="${l.id}">${l.start_time} - ${l.subject}</option>`).join('');
        }

        async function loadCurrentReplacement() {
            const lessonId = document.getElementById('repLesson').value;
            const dateStr = document.getElementById('repDate').value;
            if (!lessonId || !dateStr) {
                document.getElementById('deleteRepBtn').style.display = 'none';
                currentReplacementId = null;
                return;
            }
            try {
                const res = await fetch(`/api/replacements/${lessonId}/${dateStr}`);
                const data = await res.json();
                if (data && data.id) {
                    currentReplacementId = data.id;
                    document.getElementById('deleteRepBtn').style.display = 'block';
                    document.getElementById('repNewSubject').value = data.new_subject || '';
                    document.getElementById('repNewTeacher').value = data.new_teacher_id || '';
                    document.getElementById('repNewClassroom').value = data.new_classroom_id || '';
                    document.getElementById('repNewStart').value = data.new_start_time || '';
                    document.getElementById('repNewEnd').value = data.new_end_time || '';
                    document.getElementById('repNote').value = data.note || '';
                    document.getElementById('repIsCancelled').checked = data.is_cancelled || false;
                } else {
                    document.getElementById('deleteRepBtn').style.display = 'none';
                    currentReplacementId = null;
                }
            } catch(e) {}
        }

        async function saveReplacement() {
            const lessonId = document.getElementById('repLesson').value;
            const dateStr = document.getElementById('repDate').value;
            if (!lessonId) { showToast('Выберите пару', 'error'); return; }
            if (!dateStr) { showToast('Выберите дату', 'error'); return; }
            const data = {
                lesson_id: parseInt(lessonId),
                replacement_date: dateStr,
                new_subject: document.getElementById('repNewSubject').value.trim() || null,
                new_teacher_id: document.getElementById('repNewTeacher').value || null,
                new_classroom_id: document.getElementById('repNewClassroom').value || null,
                new_start_time: document.getElementById('repNewStart').value || null,
                new_end_time: document.getElementById('repNewEnd').value || null,
                note: document.getElementById('repNote').value.trim() || null,
                is_cancelled: document.getElementById('repIsCancelled').checked
            };
            await fetch('/admin/api/replacements', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            showToast('Замена сохранена!');
            loadReplacementsList();
            loadCurrentReplacement();
        }

        async function deleteReplacement() {
            if (!currentReplacementId) { showToast('Нет замены', 'error'); return; }
            if (!confirm('Удалить замену?')) return;
            await fetch(`/admin/api/replacements/${currentReplacementId}`, { method: 'DELETE' });
            showToast('Замена удалена');
            document.getElementById('deleteRepBtn').style.display = 'none';
            currentReplacementId = null;
            loadReplacementsList();
        }

        async function loadReplacementsList() {
            try {
                const res = await fetch('/api/replacements/all');
                const data = await res.json();
                const container = document.getElementById('replacementsList');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state"><span class="emoji">🔄</span>Нет замен</div>`;
                    return;
                }
                container.innerHTML = data.map(r => `
                    <div class="list-item">
                        <div class="info">
                            <span class="title">📅 ${r.replacement_date} • ${r.group}</span>
                            <span class="sub">${r.subject} ${r.is_cancelled ? '<span class="badge-cancelled">❌ Отменена</span>' : ''} ${r.new_subject ? `→ ${r.new_subject}` : ''} ${r.note ? `📌 ${r.note}` : ''}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteReplacementById(${r.id})">🗑</button>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function deleteReplacementById(id) {
            if (!confirm('Удалить замену?')) return;
            await fetch(`/admin/api/replacements/${id}`, { method: 'DELETE' });
            showToast('Замена удалена');
            loadReplacementsList();
        }

        // ============ UPDATE SELECTS ============
        async function updateSelects() {
            try {
                const groups = await (await fetch('/api/groups')).json();
                const teachers = await (await fetch('/api/teachers')).json();
                const classrooms = await (await fetch('/api/classrooms')).json();
                document.getElementById('lessonGroup').innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
                document.getElementById('lessonTeacher').innerHTML = teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                document.getElementById('lessonClassroom').innerHTML = classrooms.map(c => `<option value="${c.id}">${c.number}</option>`).join('');
                if (document.getElementById('lessonGroup').value) loadLessons();
            } catch(e) {}
        }

        // ============ INIT ============
        async function init() {
            const tg = window.Telegram?.WebApp;
            const userId = tg?.initDataUnsafe?.user?.id || 5028080287;
            if (userId !== ADMIN_ID) {
                document.body.innerHTML = `<div style="text-align:center;padding:60px;"><h2>⛔ Доступ запрещен</h2><p>Только для администраторов</p></div>`;
                return;
            }
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('repDate').value = today;
            document.getElementById('lessonSpecificDate').value = today;
            await loadGroups();
            await loadTeachers();
            await loadClassrooms();
            await updateSelects();
            await loadGroupsForReplacement();
            await loadTeachersForReplacement();
            await loadClassroomsForReplacement();
        }
        init();
    </script>
</body>
</html>
