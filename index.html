<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание НГАТУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-content">
                <h1 id="pageTitle">📚 Расписание</h1>
                <button class="header-btn" id="adminBtn" onclick="window.location.href='/admin'" style="display:none;">
                    🛠
                </button>
            </div>
        </header>

        <!-- СТРАНИЦЫ -->
        <main class="main-content">
            <!-- СТРАНИЦА 1: РАСПИСАНИЕ -->
            <div class="page active" id="page-schedule">
                <!-- ВЫБОР ДАТЫ -->
                <div class="date-selector">
                    <input type="date" id="datePicker" onchange="onDateChange(this.value)">
                    <button class="today-btn" onclick="resetToToday()">📅 Сегодня</button>
                </div>
                
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="🔍 Поиск группы..." oninput="searchGroups(this.value)">
                </div>
                <div id="groupsList" class="groups-list"></div>
                <div id="scheduleView" style="display:none;">
                    <div class="week-tabs">
                        <button class="week-tab active" onclick="selectWeek(0)">Чётная</button>
                        <button class="week-tab" onclick="selectWeek(1)">Нечётная</button>
                    </div>
                    <div class="days-scroll">
                        <button class="day-btn active" onclick="loadDay(0)">Пн</button>
                        <button class="day-btn" onclick="loadDay(1)">Вт</button>
                        <button class="day-btn" onclick="loadDay(2)">Ср</button>
                        <button class="day-btn" onclick="loadDay(3)">Чт</button>
                        <button class="day-btn" onclick="loadDay(4)">Пт</button>
                        <button class="day-btn" onclick="loadDay(5)">Сб</button>
                        <button class="day-btn" onclick="loadDay(6)">Вс</button>
                    </div>
                    <div id="scheduleList" class="schedule-list"></div>
                    <button class="back-btn" onclick="backToGroups()">← Назад к группам</button>
                </div>
            </div>

            <!-- СТРАНИЦА 2: ПРЕПОДАВАТЕЛИ -->
            <div class="page" id="page-teachers">
                <div class="search-container">
                    <input type="text" id="teacherSearchInput" placeholder="🔍 Поиск преподавателя..." oninput="searchTeachers(this.value)">
                </div>
                <div id="teachersList" class="teachers-list"></div>
                <div id="teacherScheduleView" style="display:none;">
                    <div id="teacherScheduleContent"></div>
                    <button class="back-btn" onclick="backToTeachers()">← Назад к преподавателям</button>
                </div>
            </div>

            <!-- СТРАНИЦА 3: НАСТРОЙКИ -->
            <div class="page" id="page-settings">
                <div class="settings-group">
                    <label>🎨 Тема</label>
                    <div class="options-row">
                        <button class="option-btn active" onclick="setTheme('light')">☀️ Светлая</button>
                        <button class="option-btn" onclick="setTheme('dark')">🌙 Тёмная</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label>📏 Размер шрифта</label>
                    <div class="options-row">
                        <button class="option-btn" onclick="setFont('small')">Маленький</button>
                        <button class="option-btn active" onclick="setFont('medium')">Средний</button>
                        <button class="option-btn" onclick="setFont('large')">Большой</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label>📚 Выбранная группа</label>
                    <div id="selectedGroupDisplay" style="padding:12px;background:var(--card-bg);border-radius:12px;">
                        Не выбрана
                    </div>
                </div>
                <div class="settings-group">
                    <label>👨‍💻 О приложении</label>
                    <div style="padding:12px;background:var(--card-bg);border-radius:12px;font-size:14px;color:var(--text-secondary);">
                        📚 Расписание НГАТУ<br>
                        Версия 2.0.0
                    </div>
                </div>
            </div>
        </main>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchPage('schedule')">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Расписание</span>
            </button>
            <button class="nav-btn" onclick="switchPage('teachers')">
                <span class="nav-icon">👨‍🏫</span>
                <span class="nav-label">Преподаватели</span>
            </button>
            <button class="nav-btn" onclick="switchPage('settings')">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Настройки</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
